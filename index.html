 while(i<tok.length){if(/[A-Za-z]/.test(tok[i])){cmd=tok[i++];out.push(cmd);if(cmd.toUpperCase()==="Z")continue}
  const U=cmd.toUpperCase(),rel=cmd!==U,n=N[U],a=tok.slice(i,i+n).map(Number);i+=n;

function coverage(p){return covOf(p.cov,p)}
function completePart(p,quiet,Ly){Ly=Ly||p.layers[p.layers.length-1];if(Ly){Ly.cov.fill(1);drawLayer(p,Ly)}p.cov.fill(1);
 const first=!p.tdone;p.tdone=true;p.grp.classList.add("tdone");p.grp.querySelector(".gd").style.opacity=0;
 if(!quiet){const r=pic.getBoundingClientRect();for(let i=0;i<5;i++){const q=p.pts[Math.floor(Math.random()*p.pts.length)];setTimeout(()=>sparkle(r.left+q[0]*r.width/500,r.top+q[1]*r.height/450,true),i*140)}}return first}
function saveTrace(){const o={};parts.forEach(p=>{o[p.k]={d:p.tdone?1:0,l:p.layers.map(L=>[L.c,L.cov.join("")])}});o.all=state.t[cur]&&state.t[cur].all?1:0;state.t[cur]=o;persist()}
function finishAll(quiet){state.t[cur]=state.t[cur]||{};state.t[cur].all=1;persist();stopHint();
 parts.forEach((p,i)=>{const f=p.grp.querySelector(".fillc");f.setAttribute("fill",p.dc);if(quiet)f.classList.add("on");else setTimeout(()=>f.classList.add("on"),300+i*120)});
 if(!quiet){const r=pic.getBoundingClientRect();for(let i=0;i<14;i++)setTimeout(()=>sparkle(r.left+r.width*(.15+.7*Math.random()),r.top+r.height*(.1+.8*Math.random()),true),400+i*220);setTimeout(praiseBig,900)}}
function nearestAny(x,y,R){let best=null,bd=R*R;for(let k=parts.length-1;k>=0;k--){const p=parts[k];
 for(let j=0;j<p.pts.length;j++){if(!p.vis[j])continue;const dx=p.pts[j][0]-x,dy=p.pts[j][1]-y,d=dx*dx+dy*dy+(p.tdone?60:0);if(d<bd-1){bd=d;best={p,j}}}}return best}
function nearestIn(p,x,y,R,from){const n=p.pts.length,W=Math.ceil(R*2.2/TSTEP);let best=-1,bd=R*R;
 for(let o=-W;o<=W;o++){const j=wrapI(from+o,n);const dx=p.pts[j][0]-x,dy=p.pts[j][1]-y,d=dx*dx+dy*dy;if(d<bd){bd=d;best=j}}return best}
function setCov(p,Ly,j){Ly.cov[j]=1;p.cov[j]=1}
function coverRange(p,Ly,a,b){const n=p.pts.length;let f=wrapI(b-a,n),dir=1;if(f>n/2){f=n-f;dir=-1}for(let i=0;i<=f;i++)setCov(p,Ly,wrapI(a+dir*i,n));
 let j=wrapI(b+1,n),g=0;while(!p.vis[j]&&g++<n){setCov(p,Ly,j);j=wrapI(j+1,n)}j=wrapI(b-1,n);g=0;while(!p.vis[j]&&g++<n){setCov(p,Ly,j);j=wrapI(j-1,n)}}
function traceAt(o,x,y,radS,travel){stopHint();
 if(o.p){const p=o.p,j=nearestIn(p,x,y,radS,o.j);if(j>=0){const n=p.pts.length;let f=wrapI(j-o.j,n),dir=1;if(f>n/2){f=n-f;dir=-1}
   const allow=Math.ceil((travel||0)/TSTEP)+1,stepN=Math.min(f,allow),nj=wrapI(o.j+dir*stepN,n);if(stepN>0){coverRange(p,o.L,o.j,nj);o.j=nj}}else o.p=null}
 if(!o.p){const h=nearestAny(x,y,radS);if(!h)return;const p=h.p,n=p.pts.length;o.p=p;o.j=h.j;
  const top=p.layers[p.layers.length-1];o.L=(top&&top.c===color.v)?top:newLayer(p,color.v);
  const w=Math.round(SEG/TSTEP);for(let i=-w;i<=w;i++){const jj=wrapI(h.j+i,n);if(p.vis[jj])setCov(p,o.L,jj)}}
 const p=o.p;tp=p;refreshGuides();drawLayer(p,o.L);
 if(!p.tdone&&coverage(p)>=TDONE){completePart(p,false,o.L);o.p=null;saveTrace();if(parts.every(q=>q.tdone))finishAll(false)}
 else if(p.tdone&&o.L&&covOf(o.L.cov,p)>=TDONE&&!o.L.cov.every(Boolean)){completePart(p,false,o.L);o.p=null;saveTrace()}}
// ---- idle hint: glowing dot + finger slides along an untraced stretch ----
let hintT;function stopHint(){clearTimeout(hintT);if(hintAnim)cancelAnimationFrame(hintAnim);hintAnim=null;dotEl.style.opacity=0;hand.classList.remove("show");hintT=setTimeout(runHint,2000)}
function idleHint(){stopHint()}
function runHint(){if(mode!="trace"||$("#start").className.indexOf("hide")<0)return;const p=tq.find(q=>!q.tdone);if(!p)return;const n=p.pts.length;
 let s=-1;for(let j=0;j<n;j++)if(!p.cov[j]&&p.vis[j]&&(p.cov[(j-1+n)%n]||!p.vis[(j-1+n)%n])){s=j;break}if(s<0)s=p.vis.indexOf(true);
 tp=p;refreshGuides();const len=Math.min(70,n-1),t0=performance.now(),D=2600;
 const step=t=>{const u=Math.min(1,(t-t0)/D),e=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2,j=(s+Math.round(e*len))%n,q=p.pts[j];
  dotEl.setAttribute("transform",`translate(${q[0]} ${q[1]})`);dotEl.style.opacity=u>.92?(1-u)*12:1;
  const r=pic.getBoundingClientRect(),sr=stage.getBoundingClientRect();hand.style.left=(r.left-sr.left+q[0]*r.width/500+4)+"px";hand.style.top=(r.top-sr.top+q[1]*r.height/450+4)+"px";hand.classList.add("show");
  if(u<1)hintAnim=requestAnimationFrame(step);else{hand.classList.remove("show");hintT=setTimeout(runHint,1200)}};hintAnim=requestAnimationFrame(step)}
function placeDot(){}
// ---------- input ----------
function toSvg(e){const r=pic.getBoundingClientRect();return[Math.round((e.clientX-r.left)*500/r.width),Math.round((e.clientY-r.top)*450/r.height),500/r.width]}
function partAt(x,y){const pt=pic.createSVGPoint();pt.x=x;pt.y=y;for(let k=parts.length-1;k>=0;k--)if(parts[k].grp.querySelector(".base").isPointInFill(pt))return parts[k];return null}
const act={};
pic.addEventListener("pointerdown",e=>{$("#menu").style.display="none";try{pic.setPointerCapture(e.pointerId)}catch(_){}
 const q=toSvg(e);sparkle(e.clientX,e.clientY);
 if(mode=="trace"){const o={t:1,last:q,p:null,j:0};act[e.pointerId]=o;ringAt(e,true);traceAt(o,q[0],q[1],85*q[2]);return}
 const p=partAt(q[0],q[1]);if(!p)return;const o={p,c:color.v,pts:[q],t0:Date.now(),moved:0,maxd:0};o.el=addStroke(p,o.c,o.pts);o.rec={c:o.c,d:o.pts};p.strokes.push(o.rec);act[e.pointerId]=o;
 if(!p.done&&mark(p,[q])>=DONE){fillPart(p,o.c,false);if(!parts.every(x=>x.done))praiseSmall();checkAllColor()}});
pic.addEventListener("pointermove",e=>{const o=act[e.pointerId];if(!o)return;const q=toSvg(e);sparkle(e.clientX,e.clientY);
 if(o.t){ringAt(e,true);const l=o.last,steps=Math.max(1,Math.ceil(Math.hypot(q[0]-l[0],q[1]-l[1])/8));const sl=Math.hypot(q[0]-l[0],q[1]-l[1])/steps;for(let i=1;i<=steps;i++)traceAt(o,l[0]+(q[0]-l[0])*i/steps,l[1]+(q[1]-l[1])*i/steps,85*q[2],sl);o.last=q;return}
 const l=o.pts[o.pts.length-1];const dd=Math.hypot(q[0]-l[0],q[1]-l[1]);if(dd<2)return;o.moved+=dd;
  o.maxd=Math.max(o.maxd,Math.hypot(q[0]-o.pts[0][0],q[1]-o.pts[0][1]));o.pts.push(q);if(o.el){o.el.setAttribute("d","M"+o.pts.map(v=>v[0]+" "+v[1]).join("L"));
  const seg=[],n=Math.ceil(dd/8);for(let i=1;i<=n;i++)seg.push([l[0]+(q[0]-l[0])*i/n,l[1]+(q[1]-l[1])*i/n]);
  if(!o.p.done&&mark(o.p,seg.concat(o.pts.length<4?o.pts:[]))>=DONE){fillPart(o.p,o.c,false);if(!parts.every(x=>x.done))praiseSmall();checkAllColor()}}});
const up=e=>{const o=act[e.pointerId];if(!o)return;delete act[e.pointerId];
 if(o.t){ringAt(e,false);saveTrace();idleHint();return}

 saveColor()};
pic.addEventListener("pointerup",up);pic.addEventListener("pointercancel",up);
state.cd=state.cd||{};let celebrated=state.cd;
function checkAllColor(){if(parts.every(p=>p.done)&&!celebrated[cur]){celebrated[cur]=1;persist();const r=pic.getBoundingClientRect();
 for(let i=0;i<12;i++)setTimeout(()=>sparkle(r.left+r.width*(.15+.7*Math.random()),r.top+r.height*(.1+.8*Math.random()),true),i*220);setTimeout(praiseBig,900)}}
let lastSp=0;function sparkle(x,y,force){if(!spk.checked)return;const now=performance.now();if(!force&&now-lastSp<90)return;lastSp=now;const r=stage.getBoundingClientRect();
 const d=document.createElement("div");d.className="sp";d.style.left=(x-r.left+(Math.random()-.5)*36)+"px";d.style.top=(y-r.top+(Math.random()-.5)*36)+"px";stage.append(d);setTimeout(()=>d.remove(),1700)}
// ---------- parent menu ----------
let ringEl=null;function ringAt(e,on){if(!ringEl){ringEl=document.createElement('div');ringEl.id='fring';stage.append(ringEl)}const sr=stage.getBoundingClientRect();ringEl.style.left=(e.clientX-sr.left)+'px';ringEl.style.top=(e.clientY-sr.top)+'px';ringEl.classList.toggle('on',on)}
let gt;const gb=$("#gear"),ring=$("#ring");
gb.onpointerdown=()=>{ring.classList.remove("go");void ring.offsetWidth;ring.classList.add("go");gt=setTimeout(()=>{$("#menu").style.display="block"},1500)};
gb.onpointerup=gb.onpointerleave=gb.onpointercancel=()=>{clearTimeout(gt);ring.classList.remove("go")};gb.oncontextmenu=e=>e.preventDefault();
$("#clear").onclick=()=>{if(mode=="trace")delete state.t[cur];else delete state.c[cur];delete celebrated[cur];persist();load(cur);$("#menu").style.display="none"};
$("#close").onclick=()=>{$("#menu").style.display="none"};
// ---------- layout / iOS ----------
function fit(){const r=stage.getBoundingClientRect(),w=Math.max(50,r.width-16),h=Math.max(50,r.height-16),k=Math.min(w/500,h/450),el=$("#wrap");el.style.width=(500*k)+"px";el.style.height=(450*k)+"px";if(tp)placeDot()}
window.addEventListener("resize",fit);window.addEventListener("orientationchange",()=>setTimeout(fit,300));
document.addEventListener("touchmove",e=>{if(!e.target.closest||!e.target.closest("#side")&&!e.target.closest("#pal")&&!e.target.closest(".navg"))e.preventDefault()},{passive:false});
document.addEventListener("gesturestart",e=>e.preventDefault());document.addEventListener("dblclick",e=>e.preventDefault());
document.getElementById("mus").onclick=()=>setMusic(!musicOn());document.getElementById("musc").onchange=e=>setMusic(e.target.checked);document.getElementById("mus").classList.toggle("off",!musicOn());document.getElementById("musc").checked=musicOn();
fit();load(0);
</script></body></html>
