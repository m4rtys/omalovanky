<script>
"use strict";
const LS=(()=>{try{const s=window.localStorage;s.setItem("_t","1");return s}catch(e){return {}}})();
const E=(x,y,rx,ry)=>{ry=ry===undefined?rx:ry;return `M${x-rx} ${y}a${rx} ${ry} 0 1 0 ${2*rx} 0a${rx} ${ry} 0 1 0 ${-2*rx} 0Z`};
const RR=(x,y,w,h,r)=>`M${x+r} ${y}h${w-2*r}q${r} 0 ${r} ${r}v${h-2*r}q0 ${r} ${-r} ${r}h${-(w-2*r)}q${-r} 0 ${-r} ${-r}v${-(h-2*r)}q0 ${-r} ${r} ${-r}Z`;
const POLY=pts=>"M"+pts.map(p=>p[0].toFixed(1)+" "+p[1].toFixed(1)).join("L")+"Z";
const rot=(pts,cx,cy,a)=>pts.map(([x,y])=>[cx+(x-cx)*Math.cos(a)-(y-cy)*Math.sin(a),cy+(x-cx)*Math.sin(a)+(y-cy)*Math.cos(a)]);
const INK="#4a403a";
const eye=(x,y,s)=>{s=s||1;return `<ellipse cx="${x}" cy="${y}" rx="${13*s}" ry="${16*s}" fill="${INK}"/><circle cx="${x+4*s}" cy="${y-6*s}" r="${5*s}" fill="#fff"/><circle cx="${x-4*s}" cy="${y+5*s}" r="${2.2*s}" fill="#fff"/>`};
const blush=(x,y)=>`<ellipse cx="${x}" cy="${y}" rx="15" ry="9" fill="#f4a7b0" opacity=".55"/>`;
const smile=(x,y,w)=>{w=w||10;return `<path d="M${x-w} ${y}q${w/2} ${w*.8} ${w} 0q${w/2} ${w*.8} ${w} 0" fill="none" stroke="${INK}" stroke-width="4" stroke-linecap="round"/>`};
const grin=(x,y,w)=>`<path d="M${x-w} ${y}q${w} ${w*1.1} ${2*w} 0" fill="none" stroke="${INK}" stroke-width="4" stroke-linecap="round"/>`;
const ln=(d,c,w)=>`<path d="${d}" fill="none" stroke="${c||INK}" stroke-width="${w||4}" stroke-linecap="round" stroke-linejoin="round"/>`;
const dot=(x,y,r,c)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${c||INK}"/>`;
// ---- light client-side lock (SHA-256 of password; not real security) ----
const PWH="42029ef215256f8fa9fedb53542ee6553eef76027b116f8fac5346211b1e473c";
function sha256(s){const K=[],H=[];let p=2,n=0;const f=x=>(x-Math.floor(x))*4294967296|0;
 while(n<64){let ok=true;for(let d=2;d*d<=p;d++)if(p%d===0){ok=false;break}if(ok){if(n<8)H[n]=f(Math.pow(p,1/2));K[n++]=f(Math.pow(p,1/3))}p++}
 const b=unescape(encodeURIComponent(s)),w=[],l=b.length*8;for(let i=0;i<b.length;i++)w[i>>2]|=b.charCodeAt(i)<<(24-(i%4)*8);
 w[l>>5]|=0x80<<(24-l%32);w[((l+64>>9)<<4)+15]=l;const h=H.slice();
 for(let j=0;j<w.length;j+=16){const W=[],a=h.slice();for(let i=0;i<64;i++){if(i<16)W[i]=w[j+i]|0;else{const x=W[i-15],y=W[i-2];
  W[i]=(((x>>>7|x<<25)^(x>>>18|x<<14)^(x>>>3))+W[i-7]+((y>>>17|y<<15)^(y>>>19|y<<13)^(y>>>10))+W[i-16])|0}
  const e=a[4],t1=a[7]+((e>>>6|e<<26)^(e>>>11|e<<21)^(e>>>25|e<<7))+((e&a[5])^(~e&a[6]))+K[i]+W[i],A0=a[0],
  t2=((A0>>>2|A0<<30)^(A0>>>13|A0<<19)^(A0>>>22|A0<<10))+((A0&a[1])^(A0&a[2])^(a[1]&a[2]));a.pop();a.unshift((t1+t2)|0);a[4]=(a[4]+t1)|0}
  for(let i=0;i<8;i++)h[i]=(h[i]+a[i])|0}
 return h.map(x=>("00000000"+(x>>>0).toString(16)).slice(-8)).join("")}
(function(){const L=document.getElementById("lock"),I=document.getElementById("pw");
 if(LS.omUnlock===PWH){L.classList.add("hide");return}
 const go=()=>{if(sha256(I.value.trim().toLowerCase())===PWH){LS.omUnlock=PWH;I.blur();L.classList.add("hide")}else{L.classList.add("bad");I.value="";setTimeout(()=>L.classList.remove("bad"),900)}};
 document.getElementById("pwgo").onclick=go;I.addEventListener("keydown",e=>{if(e.key==="Enter")go()})})();

// ===================== v11 picture library =====================
// robust path transform (abs+rel M L H V Q T C S A Z): x'=tx+sx*x, y'=ty+s*y
function T(d,tx,ty,s,sx){sx=sx===undefined?s:sx;const tok=d.match(/[A-Za-z]|-?\d*\.?\d+(?:e-?\d+)?/g)||[];const N={M:2,L:2,T:2,Q:4,S:4,C:6,H:1,V:1,A:7,Z:0};
 let out=[],i=0,cmd=null;const f=v=>(+v).toFixed(1).replace(/\.0$/,"");
 while(i<tok.length){if(/[A-Za-z]/.test(tok[i])){cmd=tok[i++];out.push(cmd);if(cmd.toUpperCase()==="Z")continue}
  const U=cmd.toUpperCase(),rel=cmd!==U,n=N[U],a=tok.slice(i,i+n).map(Number);i+=n;
  const X=v=>rel?sx*v:tx+sx*v,Y=v=>rel?s*v:ty+s*v;
  if(U==="H")out.push(f(X(a[0])));else if(U==="V")out.push(f(Y(a[0])));
  else if(U==="A")out.push(f(a[0]*Math.abs(sx)),f(a[1]*Math.abs(s)),a[2],a[3],(sx*s<0?1-a[4]:a[4]),f(X(a[5])),f(Y(a[6])));
  else for(let k=0;k<n;k+=2)out.push(f(X(a[k])),f(Y(a[k+1])))}
 return out.join(" ")}
const place=(pic,tx,ty,s,mir)=>{const sx=mir?-s:s;return {p:pic.p.map(([d,c])=>[T(d,tx,ty,s,sx),c]),d:()=>`<g transform="translate(${tx} ${ty}) scale(${sx} ${s})">${pic.d()}</g>`}};
const combine=(...xs)=>({p:[].concat(...xs.map(x=>x.p)),d:()=>xs.map(x=>x.d?x.d():"").join("")});
const P_=(p,d)=>({p,d:d||(()=>"")});
const closedEye=(x,y,w)=>ln(`M${x-w} ${y}Q${x} ${y+w*.9} ${x+w} ${y}`,INK,4);
// ---------- props ----------
const GREEN="#9fcf98",GREEN2="#7fb878",LGREEN="#b5dca8",BROWN="#b8957a",DBROWN="#9a7a62",YEL="#f4dc7d",ORA="#f2b27a",RED="#e88a84",BLUE="#8fbbe0",SKY="#cfe3f5",PURP="#b9a2d6",PNK="#f2b8cf",GREY="#c4cfdb",WHITE="#fff";
function sun(x,y,r){const pts=[];for(let i=0;i<24;i++){const a=i*Math.PI/12,R=i%2?r*1.18:r*1.5;pts.push([x+R*Math.cos(a),y+R*Math.sin(a)])}
 return P_([[POLY(pts),"#f6c66b"],[E(x,y,r),YEL]],()=>eye(x-r*.35,y-r*.05,r/50)+eye(x+r*.35,y-r*.05,r/50)+smile(x,y+r*.35,r*.16))}
const cloud=(x,y,s)=>P_([[`M${x-62*s} ${y+22*s}Q${x-84*s} ${y-8*s} ${x-48*s} ${y-14*s}Q${x-40*s} ${y-52*s} ${x} ${y-42*s}Q${x+34*s} ${y-60*s} ${x+52*s} ${y-16*s}Q${x+88*s} ${y-12*s} ${x+66*s} ${y+22*s}Z`,WHITE]]);
const hill=(y,c)=>P_([[`M0 ${y}Q125 ${y-34} 250 ${y}T500 ${y}L500 450L0 450Z`,c||LGREEN]]);
const sea=(y,c)=>P_([[`M0 ${y}Q62 ${y-22} 125 ${y}T250 ${y}T375 ${y}T500 ${y}L500 450L0 450Z`,c||BLUE]]);
const sand=y=>P_([[`M0 ${y}Q250 ${y-28} 500 ${y}L500 450L0 450Z`,"#f3dfb3"]]);
function flower(x,y,s,c){return P_([[`M${x-5*s} ${y}L${x+5*s} ${y}L${x+5*s} ${y+72*s}L${x-5*s} ${y+72*s}Z`,GREEN2],[`M${x+4*s} ${y+46*s}Q${x+34*s} ${y+22*s} ${x+42*s} ${y+42*s}Q${x+26*s} ${y+62*s} ${x+4*s} ${y+58*s}Z`,GREEN],[scallop(x,y,20*s,5,22*s),c],[E(x,y,12*s),YEL]])}

 if(o.p){const p=o.p,j=nearestIn(p,x,y,radS,o.j);if(j>=0){const n=p.pts.length;let f=wrapI(j-o.j,n),dir=1;if(f>n/2){f=n-f;dir=-1}
   const allow=Math.ceil((travel||0)/TSTEP)+1,stepN=Math.min(f,allow),nj=wrapI(o.j+dir*stepN,n);if(stepN>0){coverRange(p,o.L,o.j,nj);o.j=nj}}else o.p=null}
 if(!o.p){const h=nearestAny(x,y,radS);if(!h)return;const p=h.p,n=p.pts.length;o.p=p;o.j=h.j;
  const top=p.layers[p.layers.length-1];o.L=(top&&top.c===color.v)?top:newLayer(p,color.v);

 const p=o.p;tp=p;refreshGuides();drawLayer(p,o.L);
 if(!p.tdone&&coverage(p)>=TDONE){completePart(p,false,o.L);o.p=null;saveTrace();if(parts.every(q=>q.tdone))finishAll(false)}
 else if(p.tdone&&o.L&&covOf(o.L.cov,p)>=TDONE&&!o.L.cov.every(Boolean)){completePart(p,false,o.L);o.p=null;saveTrace()}}

let hintT;function stopHint(){clearTimeout(hintT);if(hintAnim)cancelAnimationFrame(hintAnim);hintAnim=null;dotEl.style.opacity=0;hand.classList.remove("show");hintT=setTimeout(runHint,2000)}

function runHint(){if(mode!="trace"||$("#start").className.indexOf("hide")<0)return;const p=tq.find(q=>!q.tdone);if(!p)return;const n=p.pts.length;
 let s=-1;for(let j=0;j<n;j++)if(!p.cov[j]&&p.vis[j]&&(p.cov[(j-1+n)%n]||!p.vis[(j-1+n)%n])){s=j;break}if(s<0)s=p.vis.indexOf(true);
 tp=p;refreshGuides();const len=Math.min(70,n-1),t0=performance.now(),D=2600;
 const step=t=>{const u=Math.min(1,(t-t0)/D),e=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2,j=(s+Math.round(e*len))%n,q=p.pts[j];
  dotEl.setAttribute("transform",`translate(${q[0]} ${q[1]})`);dotEl.style.opacity=u>.92?(1-u)*12:1;
  const r=pic.getBoundingClientRect(),sr=stage.getBoundingClientRect();hand.style.left=(r.left-sr.left+q[0]*r.width/500+4)+"px";hand.style.top=(r.top-sr.top+q[1]*r.height/450+4)+"px";hand.classList.add("show");
  if(u<1)hintAnim=requestAnimationFrame(step);else{hand.classList.remove("show");hintT=setTimeout(runHint,1200)}};hintAnim=requestAnimationFrame(step)}

 if(!p.done&&mark(p,[q])>=DONE){fillPart(p,o.c,false);if(!parts.every(x=>x.done))praiseSmall();checkAllColor()}});

 const l=o.pts[o.pts.length-1];const dd=Math.hypot(q[0]-l[0],q[1]-l[1]);if(dd<2)return;o.moved+=dd;
  o.maxd=Math.max(o.maxd,Math.hypot(q[0]-o.pts[0][0],q[1]-o.pts[0][1]));o.pts.push(q);if(o.el){o.el.setAttribute("d","M"+o.pts.map(v=>v[0]+" "+v[1]).join("L"));
  const seg=[],n=Math.ceil(dd/8);for(let i=1;i<=n;i++)seg.push([l[0]+(q[0]-l[0])*i/n,l[1]+(q[1]-l[1])*i/n]);
  if(!o.p.done&&mark(o.p,seg.concat(o.pts.length<4?o.pts:[]))>=DONE){fillPart(o.p,o.c,false);if(!parts.every(x=>x.done))praiseSmall();checkAllColor()}}});
